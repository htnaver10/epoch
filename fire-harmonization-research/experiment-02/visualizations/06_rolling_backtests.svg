   <text style="font-size: 9.2px; font-family: 'DejaVu Sans'; fill: #4b5563" transform="translate(30.11976 445.491461)">Models and simple baselines are refitted on the same prior history. Fold-specific masks and settings are recorded.</text>
   <text style="font-size: 9.2px; font-family: 'DejaVu Sans'; fill: #4b5563" transform="translate(30.11976 456.533977)">This prevents within-run look-ahead, but does not erase prior researcher exposure to the dataset.</text>
