<script type="module">
  import { mountChart } from "https://persistent.oaistatic.com/plugins/visualize/charts/1.2.3/element.js";
  const root = document.getElementById("fire-model-comparison");
  const selector = root.querySelector("#fire-comparison-metric");
  const configurations = new Map(Array.from(root.querySelectorAll("script[data-metric]"), node => [node.dataset.metric, JSON.parse(node.textContent)]));
  const initial = configurations.get(selector.value);
  const queryChart = mountChart(root.querySelector("#fire-query-plot"), initial.charts[0]);
  const nativeChart = mountChart(root.querySelector("#fire-native-plot"), initial.charts[1]);
  selector.addEventListener("change", () => {
    const config = configurations.get(selector.value);
    queryChart.config = config.charts[0];
    nativeChart.config = config.charts[1];
  });
</script>
